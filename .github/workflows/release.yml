name: Release Aegis Protocol

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Tipo de incremento SemVer'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      prerelease:
        description: 'Marcar release como pre-release'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Verificar, compilar y publicar release
    runs-on: windows-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular versión SemVer
        id: semver
        shell: pwsh
        env:
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch --tags --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $tag = ""
          $isNewTag = "true"

          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -match '^v\d+\.\d+\.\d+') {
            $tag = $env:GITHUB_REF_NAME
            $isNewTag = "false"
          } else {
            $exactTags = @(git tag --points-at HEAD "v[0-9]*.[0-9]*.[0-9]*" 2>$null | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' })
            if ($exactTags.Count -gt 0 -and ([string]::IsNullOrWhiteSpace($env:INPUT_BUMP) -or $env:INPUT_BUMP -eq 'auto')) {
              $tag = ($exactTags | Sort-Object { [version]($_.TrimStart('v')) } -Descending | Select-Object -First 1)
              $isNewTag = "false"
            }
          }

          $semverTags = @(git tag -l "v[0-9]*.[0-9]*.[0-9]*" | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' })
          $lastTag = if ($semverTags.Count -gt 0) {
            $semverTags | Sort-Object { [version]($_.TrimStart('v')) } -Descending | Select-Object -First 1
          } else {
            ""
          }

          if ([string]::IsNullOrWhiteSpace($tag)) {
            $major = 0
            $minor = 0
            $patch = 0
            if ($lastTag -match '^v(\d+)\.(\d+)\.(\d+)$') {
              $major = [int]$Matches[1]
              $minor = [int]$Matches[2]
              $patch = [int]$Matches[3]
            }

            $logRange = if ([string]::IsNullOrWhiteSpace($lastTag)) { "HEAD" } else { "$lastTag..HEAD" }
            $commits = (git log $logRange --format="%s%n%b") -join "`n"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $bump = if ([string]::IsNullOrWhiteSpace($env:INPUT_BUMP)) { "auto" } else { $env:INPUT_BUMP }
            if ($bump -eq "major" -or ($bump -eq "auto" -and $commits -match '(?m)^(BREAKING CHANGE:|BREAKING-CHANGE:|[a-zA-Z0-9_-]+(\([^)]+\))?!:)')) {
              $major++
              $minor = 0
              $patch = 0
            } elseif ($bump -eq "minor" -or ($bump -eq "auto" -and $commits -match '(?m)^feat(\([^)]+\))?:')) {
              $minor++
              $patch = 0
            } else {
              $patch++
            }

            $tag = "v$major.$minor.$patch"
          }

          $version = $tag.TrimStart('v')
          Write-Host "Tag anterior: $(if ($lastTag) { $lastTag } else { '(ninguno)' })"
          Write-Host "Tag release : $tag (nuevo=$isNewTag)"

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "previous_tag=$lastTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "is_new_tag=$isNewTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2

      - name: Go vet
        run: go vet ./...

      - name: Ejecutar pruebas Go
        run: go test -count=1 ./...

      - name: Verificar compilación cruzada Linux
        shell: pwsh
        run: |
          $env:GOOS = "linux"
          $env:GOARCH = "amd64"
          go build ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Instalar dependencias TypeScript
        working-directory: ts
        run: bun install --frozen-lockfile

      - name: Ejecutar pruebas TypeScript
        working-directory: ts
        run: bun test

      - name: Verificar tipos TypeScript
        working-directory: ts
        run: bun run typecheck

      - name: Compilar binarios Windows y generar SHA256SUMS
        shell: pwsh
        env:
          AEGIS_STATE_PUBLIC_KEY_BASE64: ${{ vars.AEGIS_STATE_PUBLIC_KEY_BASE64 }}
          AEGIS_STATE_KEY_ID: ${{ vars.AEGIS_STATE_KEY_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $agentLdflags = "-s -w"
          $enrollLdflags = "-s -w -H=windowsgui"

          if (-not [string]::IsNullOrWhiteSpace($env:AEGIS_STATE_PUBLIC_KEY_BASE64)) {
            $pubKey = $env:AEGIS_STATE_PUBLIC_KEY_BASE64.Trim()
            $keyId = if ([string]::IsNullOrWhiteSpace($env:AEGIS_STATE_KEY_ID)) { "ed25519-2026-11" } else { $env:AEGIS_STATE_KEY_ID.Trim() }
            $extra = " -X main.DefaultPublicKeyBase64=$pubKey -X main.DefaultPublicKeyID=$keyId"
            $agentLdflags += $extra
            $enrollLdflags += $extra
          }

          go build -trimpath "-ldflags=$agentLdflags" -o dist/aegis-agent.exe ./cmd/aegis-agent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          go build -trimpath "-ldflags=$enrollLdflags" -o dist/aegis-enroll.exe ./cmd/aegis-enroll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Smoke test CLI/GUI boundary without opening a window
          $smokeOut = Join-Path ([IO.Path]::GetTempPath()) ("aegis-enroll-smoke-" + [guid]::NewGuid().ToString('N').Substring(0, 8) + ".out")
          $smokeProc = Start-Process -FilePath (Resolve-Path .\dist\aegis-enroll.exe).Path `
            -ArgumentList '--product', 'invalid-product' `
            -Wait -NoNewWindow -RedirectStandardOutput $smokeOut -PassThru
          $smokeOutput = if (Test-Path $smokeOut) { (Get-Content -Raw -LiteralPath $smokeOut).Trim() } else { "" }
          Remove-Item -LiteralPath $smokeOut -Force -ErrorAction SilentlyContinue
          if ($smokeProc.ExitCode -ne 4 -or -not ($smokeOutput -match '"ok"\s*:\s*false')) {
            Write-Error "Smoke test de aegis-enroll.exe falló (exit=$($smokeProc.ExitCode), out=$smokeOutput)"
          }

          $hashLines = Get-ChildItem -Path dist -File |
            Where-Object { $_.Name -ne 'SHA256SUMS' } |
            Sort-Object Name |
            ForEach-Object {
              $h = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$h  $($_.Name)"
            }

          $sumsPath = Join-Path (Resolve-Path dist).Path 'SHA256SUMS'
          [System.IO.File]::WriteAllText($sumsPath, (($hashLines -join "`n") + "`n"))
          Get-Content $sumsPath

      - name: Subir artefactos de compilación
        uses: actions/upload-artifact@v4
        with:
          name: aegis-protocol-${{ steps.semver.outputs.tag }}
          path: |
            dist/aegis-agent.exe
            dist/aegis-enroll.exe
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publicar etiqueta y GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.tag }}
          name: Aegis Protocol ${{ steps.semver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease == true }}
          make_latest: ${{ (github.event_name == 'workflow_dispatch' && inputs.prerelease == true) && 'false' || 'true' }}
          files: |
            dist/aegis-agent.exe
            dist/aegis-enroll.exe
            dist/SHA256SUMS
